name: Release BatteryDevice

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 .\target\release\BatteryDevice.exe).Hash.ToLowerInvariant()
          "$hash  BatteryDevice.exe" | Out-File -Encoding ascii -NoNewline SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/BatteryDevice.exe
            SHA256SUMS.txt
